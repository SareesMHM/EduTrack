name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env: { POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: edutrack_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/edutrack_test
      JWT_SECRET: ci_secret_ci_secret_ci_secret_ci_secret
      JWT_REFRESH_SECRET: ci_refresh_ci_refresh_ci_refresh_123
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx prisma validate --schema server/prisma/schema.prisma
      - run: npx prisma db push --schema server/prisma/schema.prisma --skip-generate
      - run: npx prisma generate --schema server/prisma/schema.prisma
      - run: npm run lint
      - run: npx tsc --noEmit -p server
      - run: npx tsc --noEmit -p client
      - run: npm test
      - run: npm run build
  ml:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ml-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt pytest httpx
      - run: pytest -q
